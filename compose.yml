services:
  app:
    container_name: 'attendance_app'
    build:
      context: .
      dockerfile: ./build/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/go/app/
    ports:
      - 8080:8080
    depends_on:
      - db
    networks:
      - attendance_network

  db:
    container_name: 'attendance_db'
    image: mysql:8.4.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: attendance_management
    ports:
      - 3306:3306
    volumes:
      - ./build/database/data:/var/lib/mysql
      - ./build/database/sql:/docker-entrypoint-initdb.d
      - ./build/database/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - attendance_network

networks:
  attendance_network:
    driver: bridge
